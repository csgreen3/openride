name: Something went wrong
description: A crash, a dropped sensor, a wrong number, anything that broke.
labels: [bug, beta]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you were doing, what you expected, and what you got instead.
    validations:
      required: true
  - type: dropdown
    id: sport
    attributes:
      label: Which part?
      options: [Swim, Bike, Run, Home screen / plans, Setup, Something else]
    validations:
      required: true
  - type: input
    id: equipment
    attributes:
      label: Your equipment
      description: Trainer, treadmill, foot pod, heart rate strap or watch, with model names.
      placeholder: Wahoo KICKR Core, NordicTrack 1750, Fenix 6 Pro
  - type: input
    id: device
    attributes:
      label: Phone or tablet and Android version
      placeholder: Pixel 7, Android 14
  - type: input
    id: version
    attributes:
      label: OpenRide version
      description: Shown at the bottom of the home screen and Settings.
      placeholder: "1.24.0"
